<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%" className="w-full h-full">
  <defs>
    {/* Emerald Teal Gradients matching the Logo */}
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B5C54" />
      <stop offset="50%" stopColor="#063E38" />
      <stop offset="100%" stopColor="#032622" />
    </linearGradient>

    <linearGradient id="emeraldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#084942" />
      <stop offset="100%" stopColor="#021C19" />
    </linearGradient>

    <linearGradient id="emeraldBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#14756B" />
      <stop offset="50%" stopColor="#084942" />
      <stop offset="100%" stopColor="#021E1B" />
    </linearGradient>

    {/* Gold Gradients matching the Logo */}
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF1B8" />
      <stop offset="30%" stopColor="#E5B544" />
      <stop offset="70%" stopColor="#C99321" />
      <stop offset="100%" stopColor="#8C5E0D" />
    </linearGradient>

    <linearGradient id="goldSwoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#B37D14" />
      <stop offset="40%" stopColor="#F5D061" />
      <stop offset="75%" stopColor="#ECCB77" />
      <stop offset="100%" stopColor="#FFECA8" />
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#000000" floodOpacity="0.25" />
    </filter>
  </defs>

  {/* Background glow / transparent */}
  <g filter="url(#logoShadow)">
    
    {/* Left Arm of U (Emerald) */}
    <path 
      d="M 270 90 L 365 90 C 375 140 375 220 375 270 C 375 350 405 390 470 390 C 420 425 340 420 300 370 C 265 320 260 210 270 90 Z" 
      fill="url(#emeraldGrad)" 
    />
    
    {/* Right Arm of U (Emerald) */}
    <path 
      d="M 520 90 L 615 90 C 615 210 605 320 570 370 C 530 420 450 425 400 390 C 465 390 495 350 495 270 C 495 220 495 140 520 90 Z" 
      fill="url(#emeraldGrad)" 
    />

    {/* Bottom Curve of U */}
    <path 
      d="M 300 360 C 340 430 450 435 500 360 C 480 400 420 425 375 425 C 330 425 310 395 300 360 Z" 
      fill="url(#emeraldDark)" 
    />

    {/* Gold Globe (Left inside U) */}
    <circle cx="345" cy="270" r="55" fill="url(#goldGrad)" stroke="#063E38" strokeWidth="2" />
    {/* Globe Continents in Emerald Teal */}
    <path 
      d="M 320 250 Q 335 240 350 255 Q 365 270 355 285 Q 335 295 325 275 Z M 360 240 Q 375 250 370 265 Q 355 260 360 240 Z M 325 290 Q 345 305 365 295 Q 355 315 330 310 Z" 
      fill="#063E38" 
    />

    {/* Gold Bar Chart (Middle inside U) */}
    <rect x="420" y="270" width="18" height="45" rx="3" fill="#0B5C54" />
    <rect x="445" y="235" width="18" height="80" rx="3" fill="#0B5C54" />
    <rect x="470" y="195" width="18" height="120" rx="3" fill="url(#goldGrad)" />
    <rect x="495" y="150" width="18" height="165" rx="3" fill="url(#goldGrad)" />

    {/* Dynamic Gold Swoosh & Arrow Arching Upwards to the Right */}
    <path 
      d="M 275 280 C 275 350 350 380 430 350 C 510 320 560 240 645 130 L 640 180 L 665 110 L 595 125 L 635 140 C 555 240 500 300 425 325 C 360 345 305 325 300 275 Z" 
      fill="url(#goldSwoosh)" 
      filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.3))"
    />
  </g>

  {/* Typography Below Graphic */}
  {/* "Uomama" in Bold Dark Emerald Teal Serif */}
  <text 
    x="400" 
    y="445" 
    textAnchor="middle" 
    fontFamily="Georgia, 'Times New Roman', serif" 
    fontWeight="900" 
    fontSize="74" 
    letterSpacing="1.5"
    fill="#063E38"
  >
    Uomama
  </text>

  {/* Gold Divider Lines and BUSINESS SOLUTIONS */}
  <line x1="120" y1="468" x2="250" y2="468" stroke="#D9A62E" strokeWidth="3" strokeLinecap="round" />
  <text 
    x="400" 
    y="475" 
    textAnchor="middle" 
    fontFamily="Arial, Helvetica, sans-serif" 
    fontWeight="700" 
    fontSize="20" 
    letterSpacing="5" 
    fill="#063E38"
  >
    BUSINESS SOLUTIONS
  </text>
  <line x1="550" y1="468" x2="680" y2="468" stroke="#D9A62E" strokeWidth="3" strokeLinecap="round" />

  {/* Subtitle with gold dots */}
  <text 
    x="400" 
    y="505" 
    textAnchor="middle" 
    fontFamily="Arial, Helvetica, sans-serif" 
    fontWeight="600" 
    fontSize="13" 
    letterSpacing="4" 
    fill="#063E38"
  >
    SMART SOLUTIONS   •   BETTER BUSINESS   •   GLOBAL GROWTH
  </text>
</svg>
